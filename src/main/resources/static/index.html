<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My First App</title> <!-- Title of the webpage. What will be displayed in the tab on your browser -->
    <link rel="stylesheet" href="style.css"> <!-- Link to CSS file -->
</head>

<body>
    <h1>Welcome to My App</h1> <!-- Main heading of the page -->
    <button id="helloBtn">Say Hello</button> <!-- Button to trigger the hello message -->
    <p id="message"></p> <!-- Placeholder for the message. Currently empty -->

    <script> <!-- JavaScript to handle button click and fetch message from server -->
        document.getElementById('helloBtn').onclick = async () => {
            const response = await fetch('/hello');
            const text = await response.text();
            document.getElementById('message').innerText = text;
        }
    </script>
</body>

</html>
